# Yedek zamanlayıcı: backend uyuyan bir ortamda çalışıyorsa (ör. ücretsiz barındırma) içindeki
# zamanlayıcı tetiklenmez. Bu workflow günde bir kez POST /sync/scheduled çağırır; istek
# uygulamayı da uyandırır. Uygulama içi zamanlayıcıyla aynı kurallar geçerlidir: bitmiş
# sezonlar istek atılmadan atlanır, kilit ve kota kontrolü fazladan isteği engeller.
#
# Varsayılan olarak kapalı: repo değişkeni SCHEDULED_SYNC_ENABLED=true ile açılır.
# Gerekli repository secret'ları:
#   BACKEND_URL     ör. https://api.example.com
#   SYNC_API_TOKEN  backend'deki SYNC_API_TOKEN ile aynı değer
name: Scheduled sync

on:
  schedule:
    - cron: "30 4 * * *" # UTC; uygulama içi zamanlayıcıdan (04:00) sonra
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.SCHEDULED_SYNC_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Trigger scheduled sync
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SYNC_API_TOKEN: ${{ secrets.SYNC_API_TOKEN }}
        run: |
          # Uyuyan instance'ın açılması ~1 dk sürebilir: uzun timeout + retry.
          status=$(curl -sS -o response.json -w "%{http_code}" \
            --max-time 300 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST "$BACKEND_URL/api/v1/sync/scheduled" \
            -H "X-Sync-Token: $SYNC_API_TOKEN")
          cat response.json; echo

          if [ "$status" != "200" ]; then
            echo "::error::Zamanlanmış güncelleme çağrısı başarısız (HTTP $status)"
            exit 1
          fi

          # Lig bazında özet: çalıştı (durum) ya da başlamadan reddedildi (neden).
          jq -r '.results[] | "Lig \(.league_external_id): \(.run.status // ("reddedildi: " + .error))"' response.json
          jq -r '.results[] | select(.error != null) | "::warning::Lig \(.league_external_id) atlandı: \(.error)"' response.json

          if [ "$(jq -r '.failed' response.json)" = "true" ]; then
            echo "::error::En az bir ligin güncellemesi başarısız oldu"
            exit 1
          fi
