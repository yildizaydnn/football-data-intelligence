league: 203 # API-Football: Süper Lig (Türkiye)

meta:
  name: Süper Lig
  sources:
    - TFF Futbol Müsabaka Talimatı (puan eşitliği maddesi)
  verified: false
  notes: >
    Değerler genel bilgiyle yazıldı, resmi talimatla karşılaştırılmalı.
    Avrupa kontenjanları kupa şampiyonlarına ve ülke katsayısına göre sezondan sezona
    değiştiği için yalnızca Şampiyonlar Ligi ve küme düşme bölgeleri tanımlı.
    2022/23–2024/25 final tabloları Wikipedia ile karşılaştırıldı (14.11.2026).
    Farklar RSSSF ve basınla doğrulandı. 2024/25'te 45 puanda eşit üç takımın sırası RSSSF ile
    aynı (aralarındaki maçlar); Wikipedia bu sıralamada farklı.

